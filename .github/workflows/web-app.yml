# Keeps the live web demo at https://arancastro.github.io/app/ in step with the app code.
# On every change to mobile/ on main, exports the Expo web build (base URL /app) and commits
# it to the app/ folder, which GitHub Pages serves.
name: Update web demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/web-app.yml'

permissions:
  contents: write

concurrency:
  group: web-demo
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Export web build
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo export --platform web

      - name: Publish to app/
        run: |
          rm -rf app
          cp -r mobile/dist app
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .nojekyll
          if git diff --cached --quiet; then
            echo "Web demo already up to date."
          else
            git commit -m "Update web demo from ${GITHUB_SHA::7}"
            git push
          fi
